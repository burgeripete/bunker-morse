# Builds the web version and publishes it to GitHub Pages on every push to main.
# It needs Settings > Pages > Source set to "GitHub Actions" once.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup target add wasm32-unknown-unknown
      - run: node web/build.mjs
      - run: node --test web/test.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
