[package]
name = "bunker-morse"
version = "0.1.0"
edition = "2024"
description = "Listens to DayZ game audio and decodes the Morse bunker broadcast into coordinates and keypad codes."
default-run = "bunker-morse"

[features]
default = ["native"]
# Everything that needs Windows or a window. The web build turns this off and
# keeps just the decoder.
native = [
    "dep:anyhow",
    "dep:env_logger",
    "dep:flume",
    "dep:gpui-kit",
    "dep:log",
    "dep:symphonia",
    "dep:sysinfo",
    "dep:wasapi",
]

[dependencies]
anyhow = { version = "1", optional = true }
env_logger = { version = "0.11", optional = true }
flume = { version = "0.11", optional = true }
gpui-kit = { version = "0.9", optional = true }
log = { version = "0.4", optional = true }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["aac", "mkv", "isomp4", "wav", "pcm"] }
sysinfo = { version = "0.37", optional = true }
wasapi = { version = "0.26", optional = true }

[lib]
name = "bunker_morse"
path = "src/lib.rs"

[[bin]]
name = "bunker-morse"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "bunker-morse-cli"
path = "src/bin/cli.rs"
required-features = ["native"]

[[test]]
name = "recording"
required-features = ["native"]

# The detector runs a DFT bank on every audio hop, too slow unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
